:root {
  --bg: #111211;
  --panel: #1a1b19;
  --line: #2e302d;
  --edge: #3a3c3a;
  --fg: #d6d3cc;
  --muted: #9a9890;
  --faint: #4a4c48;
  --danger: #c99a8c;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
a { color: var(--fg); }

.app {
  height: 100%; max-width: 640px; margin: 0 auto;
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px));
}
.dots { display: flex; gap: 7px; height: 20px; align-items: center; }
.dot { width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--faint); }
.dot.used { background: var(--muted); border-color: var(--muted); }

.stage {
  position: relative; min-height: 0;
  display: flex; align-items: center;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.card { width: 100%; display: grid; gap: 20px; transition: transform 240ms ease, opacity 240ms ease; }
.card.dragging { transition: none; }
.thought {
  margin: 0; font-weight: 300; font-size: clamp(19px, 5.3vw, 24px); line-height: 1.45; letter-spacing: -0.01em;
  overflow-wrap: anywhere; text-wrap: pretty;
}
.thought.struck { opacity: 0.35; text-decoration: line-through; text-decoration-thickness: 1px; }
.delta { display: flex; align-items: baseline; gap: 12px; min-height: 30px; opacity: 0; transition: opacity 200ms ease; }
.delta.show { opacity: 1; }
.delta b { font-size: 18px; font-weight: 500; }
.delta span { color: var(--muted); font-size: 13px; }
.rest { display: grid; gap: 12px; }
.rest p { margin: 0; font-weight: 300; font-size: clamp(19px, 5.3vw, 24px); line-height: 1.45; }
.rest span { color: var(--muted); font-size: 13px; }

.foot { display: flex; justify-content: flex-end; align-items: center; min-height: 44px; }
.plus { width: 44px; height: 44px; margin-right: -12px; color: var(--muted); font-size: 26px; font-weight: 300; }
.plus:hover { color: var(--fg); }

/* Menü */
.menu {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: min(584px, calc(100vw - 56px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  z-index: 10;
}
.menu-row { display: grid; grid-template-columns: 1fr 1fr; }
.menu-row + .menu-row { border-top: 1px solid var(--line); }
.menu-row button { padding: 15px 8px; font-size: 15px; }
.menu-row button + button { border-left: 1px solid var(--line); }
.menu-row.small button { padding: 12px 8px; font-size: 13px; color: var(--muted); }
.menu-row button:hover { background: #20211f; }
.menu-note { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 10px; position: fixed; left: 0; right: 0; z-index: 10; }

/* Schreiben: direkt im Text, nur der Cursor */
.stage.editing { touch-action: auto; }
.thought[contenteditable="true"], .thought[contenteditable="plaintext-only"] {
  outline: none; caret-color: var(--fg); user-select: text; -webkit-user-select: text; cursor: text;
}
.thought.editing:empty::before { content: attr(data-ph); color: var(--faint); }
.count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: auto; }
.count.over { color: var(--danger); }
.done { height: 44px; padding: 0 2px; color: var(--fg); font-size: 14px; }

/* Dialoge */
dialog {
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px; padding: 0;
  width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
}
dialog::backdrop { background: rgba(6, 6, 6, 0.72); }
.dlg { padding: 20px; display: grid; gap: 14px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; }
.dlg h2 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dlg h3 { margin: 0; font-size: 12px; font-weight: 500; }
.btn { padding: 9px 14px; border: 1px solid var(--edge); border-radius: 4px; color: var(--muted); font-size: 13px; }
.btn:hover { color: var(--fg); }
.btn.primary { color: var(--fg); border-color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.section { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.field { display: grid; gap: 5px; }
.field label { color: var(--muted); font-size: 12px; }
.field input { width: 100%; padding: 9px 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--edge); border-radius: 4px; font: 13px var(--font); }
.status { font-size: 12px; color: var(--muted); min-height: 1em; overflow-wrap: anywhere; }
.status.err { color: var(--danger); }
.list { display: grid; overflow-y: auto; max-height: 60vh; }
.item { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.item p { margin: 0; font-weight: 300; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.item-row button { color: var(--muted); padding: 6px 0; font-size: 12px; }
.item-row button:hover { color: var(--fg); }
.item-row button.warn { color: var(--danger); }
.item-row .btns { gap: 18px; }
.empty-note { color: var(--muted); font-size: 13px; margin: 0; padding: 6px 0; }
.sync-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.sync-dot.idle { background: #8fb59a; }
.sync-dot.syncing { background: var(--muted); }
.sync-dot.error { background: var(--danger); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 14px; font-size: 13px; z-index: 30; max-width: calc(100vw - 32px);
}
@media (prefers-reduced-motion: reduce) { .card, .delta { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <div class="dots" id="dots" title=""><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <main class="stage" id="stage">
    <div class="card" id="card"></div>
  </main>
  <div class="foot"><span class="count" id="edCount" hidden></span><button type="button" class="done" id="btnDone" hidden>fertig</button><button type="button" class="plus" id="btnNew" aria-label="Neuer Gedanke">+</button></div>
</div>

<div class="menu" id="menu" hidden>
  <div class="menu-row">
    <button type="button" id="mEdit">umformulieren</button>

<dialog id="dlgArchive" aria-labelledby="archTitle">
  <div class="dlg">

<dialog id="dlgSettings" aria-labelledby="setTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="setTitle">Einstellungen</h2><button type="button" class="btn" data-close>Schliessen</button></div>
    <div class="section">
      <h3>GitHub-Sync</h3>
      <div class="sync-line"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">nicht verbunden</span></div>
      <p class="hint">Die Gedanken liegen als JSON in einem separaten GitHub-Repository. Token unter
        <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a>
        erstellen; «Contents: Read and write» auf das Daten-Repo genügt.</p>
      <div class="field"><label for="cfg-owner">GitHub-Benutzername / Organisation</label><input type="text" id="cfg-owner" autocomplete="off"></div>
      <div class="field"><label for="cfg-repo">Repository</label><input type="text" id="cfg-repo" autocomplete="off" placeholder="horizont-data"></div>
      <div class="field"><label for="cfg-path">Pfad zur Datei</label><input type="text" id="cfg-path" autocomplete="off" placeholder="horizont-daten.json"></div>
      <div class="field"><label for="cfg-token">Personal Access Token</label><input type="password" id="cfg-token" autocomplete="off" placeholder="github_pat_…"></div>
      <div class="btns">
        <button type="button" class="btn primary" id="btnSaveSync">Verbinden &amp; synchronisieren</button>
        <button type="button" class="btn" id="btnSyncNow">Jetzt synchronisieren</button>

        <button type="button" class="btn" id="btnImport">JSON importieren …</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">
      <div class="status" id="importStatus"></div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
/* =========================================================================
   Konstanten & State
   ========================================================================= */
const STORAGE_KEY = 'horizont_data_v1';
const CONFIG_KEY  = 'horizont_sync_config_v1';
const SHA_KEY     = 'horizont_remote_sha_v1';

const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const LIMIT = 3;              // neue Gedanken pro gleitender Stunde
const MAXLEN = 280;           // Zeichen pro Gedanke
const SHOWN_CAP = 500;        // gespeicherte Anzeige-Zeitpunkte pro Gedanke
const RETURN_AFTER = 5 * MIN; // nach so langer Abwesenheit gilt die App als neu geöffnet
const MIN_BASE = 6 * HOUR;    // kürzeste Grundzeit
const DEFAULT_VPD = 6;        // angenommene Gedanken pro Tag, solange Erfahrung fehlt
const SWIPE = 60;             // px bis eine Wischgeste zählt
const HOLD = 520;             // ms für «halten»

let DATA = { gedanken: {} };
let syncConfig = null, remoteSha = null, syncInFlight = false, syncAgain = false;

let history = [];        // IDs in Anzeigereihenfolge (diese Stunde)
let pos = 0;             // Index in history; history.length = Ruhezustand
const passDelta = {};    // pro Gedanke: in diesem Durchlauf vergebene Punkte (−1, 0, +1)
let pendingArchive = null;  // archiviert, aber noch rückgängig zu machen
let editingId = null;

/* =========================================================================
   Utilities
   ========================================================================= */
const $ = (id) => document.getElementById(id);
const nowISO = () => new Date().toISOString();
const ms = (iso) => (iso ? Date.parse(iso) : 0);
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtTime = new Intl.DateTimeFormat('de-CH', { hour: '2-digit', minute: '2-digit' });
const fmtDate = new Intl.DateTimeFormat('de-CH', { day: 'numeric', month: 'long', year: 'numeric' });
const signed = (n) => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function newId() { return 'g-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6); }

let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}

/* =========================================================================
   Speicher (lokal)
   ========================================================================= */
const LEGACY = { sehrbald: 1, bald: 0, spaeter: -1 };
function normalizeG(g) {
  const punkte = Number.isFinite(g.punkte) ? Math.round(g.punkte) : (LEGACY[g.relevanz] ?? 0);
  return {
    text: String(g.text || ''),
    erstellt: g.erstellt || nowISO(),
    modified: g.modified || g.erstellt || nowISO(),
    punkte,
    archiviert: g.archiviert || null,
    angezeigt: Array.isArray(g.angezeigt) ? g.angezeigt.filter(Boolean) : [],
    ...(g.deleted ? { deleted: true } : {}),
  };
}
function loadLocal() {
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (p) Object.entries(p.gedanken || {}).forEach(([id, g]) => { DATA.gedanken[id] = normalizeG(g); });
  } catch (e) { console.error('Lokale Daten nicht lesbar', e); }
  try { syncConfig = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); } catch (e) { syncConfig = null; }
  try { remoteSha = localStorage.getItem(SHA_KEY) || null; } catch (e) { remoteSha = null; }
}
const currentPayload = () => ({ app: 'horizont', version: 2, updated: nowISO(), gedanken: DATA.gedanken });
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPayload())); }
  catch (e) { toast('Lokales Speichern fehlgeschlagen'); }
}
function saveSyncConfig() {
  try {
    if (syncConfig) localStorage.setItem(CONFIG_KEY, JSON.stringify(syncConfig));
    else localStorage.removeItem(CONFIG_KEY);
  } catch (e) {}
}

const Store = {
  get(id) { const g = DATA.gedanken[id]; return g && !g.deleted ? g : null; },
  all() { return Object.entries(DATA.gedanken).filter(([, g]) => !g.deleted).map(([id, g]) => ({ id, ...g })); },
  active() { return this.all().filter((g) => !g.archiviert); },
  put(id, fields) {           // inhaltliche Änderung: modified neu
    const g = DATA.gedanken[id] || normalizeG({});
    DATA.gedanken[id] = { ...g, ...fields, modified: nowISO() };
    saveLocal(); scheduleSync();
  },
  shown(id) {                 // Anzeige: wird beim Sync vereinigt, kein modified
    const g = DATA.gedanken[id]; if (!g) return;
    g.angezeigt = [...g.angezeigt, nowISO()].slice(-SHOWN_CAP);
    saveLocal(); scheduleSync();
  },
  remove(id) {
    DATA.gedanken[id] = { deleted: true, modified: nowISO(), text: '', erstellt: DATA.gedanken[id]?.erstellt || nowISO(), punkte: 0, archiviert: null, angezeigt: [] };
    saveLocal(); scheduleSync();
  },
};

/* =========================================================================
   Wiederkehr
   Grundzeit = aktive Gedanken ÷ gesehene Gedanken pro Tag (mind. 6 Std.)
   Wartezeit = Grundzeit × 2^(−Punkte)
   ========================================================================= */
function viewsPerDay(now = Date.now()) {
  const span = 14 * DAY;
  let n = 0, first = now;
  Store.all().forEach((g) => g.angezeigt.forEach((s) => {
    const t = ms(s);
    if (now - t < span) { n++; if (t < first) first = t; }
  }));
  if (n < 10) return DEFAULT_VPD;
  const days = Math.max(1, (now - first) / DAY);
  return Math.max(1, n / days);
}
function baseInterval() {
  const n = Store.active().length || 1;
  return Math.max(MIN_BASE, (n / viewsPerDay()) * DAY);
}
const waitFor = (g, base) => base * Math.pow(2, -g.punkte);
const lastShown = (g) => (g.angezeigt.length ? ms(g.angezeigt[g.angezeigt.length - 1]) : 0);

function shownThisHour(now = Date.now()) {
  const out = [];
  Store.all().forEach((g) => g.angezeigt.forEach((s) => { const t = ms(s); if (now - t < HOUR) out.push({ id: g.id, at: t }); }));
  return out.sort((a, b) => a.at - b.at);
}
const remaining = () => Math.max(0, LIMIT - shownThisHour().length);
function nextFreeAt() { const s = shownThisHour(); return s.length ? s[0].at + HOUR : Date.now(); }

function pick(exclude) {
  const now = Date.now(), base = baseInterval();
  const pool = Store.active().filter((g) => !exclude.has(g.id));
  if (!pool.length) return null;
  const scored = pool.map((g) => {
    const ls = lastShown(g);
    const score = ls ? (now - ls) / waitFor(g, base) : 6;   // nie gezeigt: Vorrang
    return { g, score: Math.min(score, 8) };
  }).sort((a, b) => b.score - a.score);
  const due = scored.filter((s) => s.score >= 1);
  const field = due.length ? due : scored.slice(0, Math.min(4, scored.length));
  const total = field.reduce((a, s) => a + s.score + 0.05, 0);
  let r = Math.random() * total;
  for (const s of field) { r -= s.score + 0.05; if (r <= 0) return s.g; }
  return field[field.length - 1].g;
}

function rebuildHistory() {
  const seen = [];
  shownThisHour().forEach((s) => { const g = Store.get(s.id); if (!seen.includes(s.id) && g && !g.archiviert) seen.push(s.id); });
  history = seen;
}
function settleArchive() {
  if (!pendingArchive) return;
  pendingArchive = null;
  history = history.filter((id) => { const g = Store.get(id); return g && !g.archiviert; });
}
function open() {
  settleArchive();
  rebuildHistory();
  pos = history.length;
  advance();
}
function advance() {
  const cur = history[pos];
  settleArchive();
  const ix = history.indexOf(cur);
  if (ix >= 0) pos = ix; else pos = Math.min(pos, history.length) - 1;
  if (pos < history.length - 1) { pos++; render(); return; }
  if (remaining() > 0) {
    const g = pick(new Set(history));
    if (g) { Store.shown(g.id); delete passDelta[g.id]; history.push(g.id); pos = history.length - 1; render(); return; }
  }
  pos = history.length;
  render();
}
function back() {
  const cur = history[pos];
  settleArchive();
  const ix = history.indexOf(cur);
  pos = ix >= 0 ? ix : Math.min(pos, history.length);
  if (pos > 0) pos--;
  render();
}
function current() {
  const id = history[pos];
  const g = id && Store.get(id);
  if (!g) return null;
  if (g.archiviert && id !== pendingArchive) return null;
  return { id, ...g };
}
const canNext = () => pos < history.length - 1 || (pos < history.length) || (remaining() > 0 && Store.active().some((g) => !history.includes(g.id)));

/* =========================================================================
   Darstellung
   ========================================================================= */
function render() {
  if (editing) return;
  history = history.filter((id) => { const g = Store.get(id); return g && (!g.archiviert || id === pendingArchive); });
  pos = Math.min(pos, history.length);

  const used = LIMIT - remaining();
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('used', i < used));
  $('dots').title = `${used} von ${LIMIT} Gedanken in dieser Stunde`;

  const card = $('card');
  card.replaceChildren();
  const g = current();
  if (g) {
    const d = el('div', 'delta'); d.id = 'delta';
    card.append(d);
    const p = el('p', 'thought' + (g.id === pendingArchive ? ' struck' : ''), g.text);
    card.append(p);
    return;
  }
  const rest = el('div', 'rest');
  if (!Store.active().length) {
    rest.append(el('p', '', 'Noch kein Gedanke.'));
    rest.append(el('span', '', syncConfig ? 'Mit + den ersten eintragen.' : 'Mit + den ersten eintragen, oder in den Einstellungen das Daten-Repo verbinden (2× tippen).'));
  } else if (remaining() === 0) {
    rest.append(el('p', '', 'Für diese Stunde ist es genug.'));
    rest.append(el('span', '', 'Nächster Gedanke ab ' + fmtTime.format(nextFreeAt())));
  } else if (Store.active().some((x) => !history.includes(x.id))) {
    rest.append(el('p', '', 'Weiter zum nächsten Gedanken.'));
  } else {
    rest.append(el('p', '', 'Alles wurde in dieser Stunde schon gezeigt.'));
  }
  card.append(rest);
}

let deltaT;
function showDelta(text, sub) {
  const d = $('delta'); if (!d) return;
  d.replaceChildren(el('b', '', text), el('span', '', sub || ''));
  d.classList.add('show');
  clearTimeout(deltaT); deltaT = setTimeout(() => d.classList.remove('show'), 1600);
}

/* Punkte: pro Durchlauf höchstens ein Schritt in eine Richtung */
function rate(dir) {
  const g = current(); if (!g || g.id === pendingArchive) return false;
  const was = passDelta[g.id] || 0;
  const next = Math.max(-1, Math.min(1, was + dir));
  if (next === was) { showDelta(signed(was), 'bereits vergeben'); return false; }
  const from = g.punkte, to = g.punkte + (next - was);
  passDelta[g.id] = next;
  Store.put(g.id, { punkte: to });
  const n = (x) => (x < 0 ? '−' + Math.abs(x) : String(x));
  showDelta(next === 0 ? '0' : signed(next), `${n(from)} → ${n(to)}`);
  return true;
}

/* =========================================================================
   Gesten: wischen, doppelt tippen, halten
   ========================================================================= */
const stage = $('stage'), cardEl = $('card');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let sx = 0, sy = 0, dx = 0, dy = 0, axis = null, down = false, pid = null, holdT = null, held = false, lastTap = 0;

function resetCard() { cardEl.classList.remove('dragging'); cardEl.style.transform = ''; cardEl.style.opacity = ''; }

stage.addEventListener('pointerdown', (e) => {
  if (editing) { if (e.target !== editing.p) finishEdit(true); return; }
  if (!$('menu').hidden) { closeMenu(); return; }
  down = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0; axis = null; held = false;
  clearTimeout(holdT);
  holdT = setTimeout(() => {
    if (down && !axis && current() && current().id !== pendingArchive) { held = true; down = false; resetCard(); openEditor(current().id, sx, sy); }
  }, HOLD);
});
stage.addEventListener('pointermove', (e) => {
  if (!down || e.pointerId !== pid) return;
  dx = e.clientX - sx; dy = e.clientY - sy;
  if (!axis && Math.hypot(dx, dy) > 10) { axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; clearTimeout(holdT); }
  if (!axis) return;
  cardEl.classList.add('dragging');
  if (axis === 'x') {
    cardEl.style.transform = `translateX(${dx}px)`;
    cardEl.style.opacity = String(1 - Math.min(Math.abs(dx) / 400, 0.6));
  } else if (current()) {
    cardEl.style.transform = `translateY(${Math.max(-140, Math.min(140, dy * 0.6))}px)`;
  }
});
function endPointer(e) {
  clearTimeout(holdT);
  if (editing) { down = false; return; }
  if (!down || (e && e.pointerId !== pid)) return;
  down = false;
  if (held) return;
  const a = axis; axis = null;
  if (a === 'x') {
    if (dx < -SWIPE && canNext()) return slide(-1, advance);
    if (dx > SWIPE && pos > 0) return slide(1, back);
  } else if (a === 'y') {
    if (dy < -SWIPE) rate(+1);
    else if (dy > SWIPE) rate(-1);
  } else {
    const t = Date.now();
    if (t - lastTap < 320) { lastTap = 0; openMenu(); }
    else lastTap = t;
  }
  resetCard();
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('contextmenu', (e) => e.preventDefault());

function slide(dir, fn) {
  closeMenu();
  if (reduced.matches) { resetCard(); fn(); return; }
  cardEl.classList.remove('dragging');
  cardEl.style.transform = `translateX(${dir * -60}px)`;
  cardEl.style.opacity = '0';
  setTimeout(() => {
    fn();
    cardEl.classList.add('dragging');
    cardEl.style.transform = `translateX(${dir * 60}px)`;
    requestAnimationFrame(() => requestAnimationFrame(resetCard));
  }, 180);
}

document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]') || editing || e.target.closest('textarea, input, [contenteditable]')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' && canNext()) { e.preventDefault(); slide(-1, advance); }
  else if (k === 'ArrowLeft' && pos > 0) { e.preventDefault(); slide(1, back); }
  else if (k === 'ArrowUp') { e.preventDefault(); rate(+1); }
  else if (k === 'ArrowDown') { e.preventDefault(); rate(-1); }
  else if (k === 'Enter' && current() && current().id !== pendingArchive) { e.preventDefault(); openEditor(current().id); }
  else if (k === 'n' || k === 'N') { e.preventDefault(); openEditor(null); }
  else if (k === 'm' || k === 'M') { e.preventDefault(); $('menu').hidden ? openMenu() : closeMenu(); }
  else if (k === 'Escape') closeMenu();
});

/* =========================================================================
   Menü
   ========================================================================= */
function openMenu() {
  const g = current();
  $('mEdit').disabled = !g || g.id === pendingArchive;
  $('mEdit').style.opacity = $('mEdit').disabled ? '0.35' : '';
  $('mArch').disabled = !g;
  $('mArch').style.opacity = g ? '' : '0.35';
  $('mArch').textContent = g && g.id === pendingArchive ? 'rückgängig' : 'archivieren';
  $('mArch').style.fontWeight = g && g.id === pendingArchive ? '500' : '';
  $('menu').hidden = false;
}
function closeMenu() { $('menu').hidden = true; }

$('mEdit').addEventListener('click', () => { const g = current(); closeMenu(); if (g) openEditor(g.id); });
$('mArch').addEventListener('click', () => {
  const g = current(); if (!g) return;
  if (g.id === pendingArchive) {
    Store.put(g.id, { archiviert: null });
    pendingArchive = null;
    toast('Nicht archiviert');
  } else {
    Store.put(g.id, { archiviert: nowISO() });
    pendingArchive = g.id;
    toast('Archiviert · rückgängig bis zum nächsten Gedanken');
  }
  render(); openMenu();
});
$('mArchive').addEventListener('click', () => { closeMenu(); renderArchive(); $('dlgArchive').showModal(); });
$('mSettings').addEventListener('click', () => { closeMenu(); openSettings(); });
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));

/* =========================================================================
   Schreiben / Umformulieren: direkt im Text, ohne Feld
   ========================================================================= */
let editing = null;   // { id, p, original }
function updCount() {
  if (!editing) return;
  const n = editing.p.textContent.trim().length;
  const c = $('edCount');
  c.hidden = n < MAXLEN - 40;
  c.textContent = `${n} / ${MAXLEN}`;
  c.classList.toggle('over', n > MAXLEN);
}
function placeCaret(p, x, y) {
  const sel = window.getSelection();
  let r = null;
  if (x != null && document.caretRangeFromPoint) r = document.caretRangeFromPoint(x, y);
  else if (x != null && document.caretPositionFromPoint) {
    const cp = document.caretPositionFromPoint(x, y);
    if (cp) { r = document.createRange(); r.setStart(cp.offsetNode, cp.offset); }
  }
  if (!r || !p.contains(r.startContainer)) { r = document.createRange(); r.selectNodeContents(p); r.collapse(false); }
  else r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}
function openEditor(id, x, y) {
  closeMenu();
  if (editing) return;
  let p;
  if (id) {
    p = cardEl.querySelector('.thought');
    if (!p || !current() || current().id !== id) return;
  } else {
    const d = el('div', 'delta'); d.id = 'delta';
    p = el('p', 'thought', '');
    p.dataset.ph = 'Ein neuer Gedanke';
    cardEl.replaceChildren(d, p);
    x = null;
  }
  editing = { id, p, original: p.textContent };
  p.classList.add('editing');
  p.contentEditable = 'plaintext-only';
  if (p.contentEditable !== 'plaintext-only') p.contentEditable = 'true';
  p.spellcheck = true;
  stage.classList.add('editing');
  $('btnNew').hidden = true; $('btnDone').hidden = false;
  p.addEventListener('input', updCount);
  p.addEventListener('beforeinput', edBefore);
  p.addEventListener('keydown', edKey);
  p.addEventListener('paste', edPaste);
  p.addEventListener('blur', edBlur);
  p.focus({ preventScroll: true });
  placeCaret(p, x, y);
  updCount();
}
function edBefore(e) {
  if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { e.preventDefault(); finishEdit(true); return; }
  const add = (e.data || '').length;
  const selLen = window.getSelection().toString().length;
  if (add && editing && editing.p.textContent.length - selLen + add > MAXLEN) e.preventDefault();
}
function edKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); finishEdit(true); }
  else if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
}
function edPaste(e) {
  e.preventDefault();
  if (!editing) return;
  const room = MAXLEN - editing.p.textContent.length + window.getSelection().toString().length;
  const t = (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ').slice(0, Math.max(0, room));
  if (t) document.execCommand('insertText', false, t);
}
function edBlur() { setTimeout(() => { if (editing && document.activeElement !== editing.p) finishEdit(true); }, 0); }
function finishEdit(save) {
  if (!editing) return;
  const { id, p, original } = editing;
  editing = null;
  p.removeEventListener('input', updCount);
  p.removeEventListener('beforeinput', edBefore);
  p.removeEventListener('keydown', edKey);
  p.removeEventListener('paste', edPaste);
  p.removeEventListener('blur', edBlur);
  p.contentEditable = 'false';
  p.blur();
  stage.classList.remove('editing');
  $('btnNew').hidden = false; $('btnDone').hidden = true; $('edCount').hidden = true;
  const text = p.textContent.replace(/\s+/g, ' ').trim();
  if (save && text && text.length <= MAXLEN) {
    if (id) {
      if (text !== original) { Store.put(id, { text }); toast('Umformuliert'); }
    } else {
      Store.put(newId(), { text, erstellt: nowISO(), punkte: 0, archiviert: null, angezeigt: [] });
      toast('Gedanke gespeichert');
    }
  }
  if (!id && !current() && pos >= history.length) open(); else render();
}
$('btnNew').addEventListener('click', () => openEditor(null));
$('btnDone').addEventListener('pointerdown', (e) => e.preventDefault());   // Fokus nicht vorher verlieren
$('btnDone').addEventListener('click', () => finishEdit(true));

/* =========================================================================
   Archiv
   ========================================================================= */
function renderArchive() {
  const list = $('archList'); list.replaceChildren();
  const arch = Store.all().filter((g) => g.archiviert && g.id !== pendingArchive).sort((a, b) => ms(b.archiviert) - ms(a.archiviert));
  if (!arch.length) { list.append(el('p', 'empty-note', 'Noch nichts archiviert.')); return; }
  arch.forEach((g) => {
    const it = el('div', 'item');
    it.append(el('p', '', g.text));
    const row = el('div', 'item-row');
    row.append(el('span', '', 'archiviert ' + fmtDate.format(ms(g.archiviert))));
    const btns = el('div', 'btns');
    const back = el('button', '', 'zurückholen'); back.type = 'button';
    back.addEventListener('click', () => { Store.put(g.id, { archiviert: null }); renderArchive(); render(); toast('Zurückgeholt'); });
    const del = el('button', '', 'löschen'); del.type = 'button';
    del.addEventListener('click', () => {
      if (del.dataset.armed) { Store.remove(g.id); renderArchive(); toast('Gelöscht'); return; }
      del.dataset.armed = '1'; del.textContent = 'endgültig löschen?'; del.classList.add('warn');
      setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = 'löschen'; del.classList.remove('warn'); } }, 4000);
    });
    btns.append(back, del);
    row.append(btns);
    it.append(row);
    list.append(it);
  });
}

/* =========================================================================
   GitHub-Sync (Contents API, Daten-Repo)
   ========================================================================= */
function utf8ToBase64(str) { const b = new TextEncoder().encode(str); let s = ''; b.forEach((x) => { s += String.fromCharCode(x); }); return btoa(s); }
function base64ToUtf8(b64) { const s = atob(b64.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(s, (c) => c.charCodeAt(0))); }
function contentsUrl(cfg) {
  return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
}
async function githubGet(cfg) {
  const r = await fetch(contentsUrl(cfg), {
    headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    cache: 'no-store',
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GET ${r.status}: ${(await r.text()).slice(0, 200)}`);
  const data = await r.json();
  let text = data.content ? base64ToUtf8(data.content) : '';
  if (!text && data.download_url) text = await (await fetch(data.download_url, { cache: 'no-store' })).text();
  return { payload: text.trim() ? JSON.parse(text) : {}, sha: data.sha };
}
async function githubPut(cfg, payload, sha) {
  const body = { message: `Sync ${nowISO()}`, content: utf8ToBase64(JSON.stringify(payload, null, 1)) };
  if (sha) body.sha = sha;
  const r = await fetch(contentsUrl(cfg), {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: JSON.stringify(body),
  });
  if (!r.ok) { const err = new Error(`PUT ${r.status}: ${(await r.text()).slice(0, 200)}`); err.status = r.status; throw err; }
  return (await r.json()).content.sha;
}

// pro ID: Inhalt (Text, Punkte, Archiv) nach neuerem `modified`, Anzeigen als Vereinigung
function mergeIncoming(payload) {
  let added = 0, updated = 0;
  Object.entries((payload && payload.gedanken) || {}).forEach(([id, raw]) => {
    const inc = normalizeG(raw), loc = DATA.gedanken[id];
    if (!loc) { DATA.gedanken[id] = inc; if (!inc.deleted) added++; return; }
    const winner = inc.modified > loc.modified ? inc : loc;
    if (winner === inc) updated++;
    if (winner.deleted) { DATA.gedanken[id] = winner; return; }
    DATA.gedanken[id] = { ...winner, angezeigt: [...new Set([...loc.angezeigt, ...inc.angezeigt])].sort().slice(-SHOWN_CAP) };
  });
  return { added, updated };
}

function setSyncStatus(state, hint) {
  $('syncDot').className = 'sync-dot ' + state;
  const labels = { idle: 'synchronisiert', syncing: 'synchronisiert gerade …', error: 'Sync-Fehler', off: 'nicht verbunden' };
  $('syncLabel').textContent = labels[state] || '';
  const st = $('syncStatus');
  if (state === 'error' && hint) { st.textContent = hint; st.className = 'status err'; }
  else if (state !== 'error') { st.textContent = ''; st.className = 'status'; }
}
async function syncNow() {
  if (!syncConfig) { setSyncStatus('off'); return; }
  if (syncInFlight) { syncAgain = true; return; }
  syncInFlight = true;
  setSyncStatus('syncing');
  try {
    for (let attempt = 1; attempt <= 2; attempt++) {
      const remote = await githubGet(syncConfig);
      if (remote) { mergeIncoming(remote.payload); remoteSha = remote.sha; } else remoteSha = null;
      try { remoteSha = await githubPut(syncConfig, currentPayload(), remoteSha); break; }
      catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 2) continue; throw e; }
    }
    try { localStorage.setItem(SHA_KEY, remoteSha || ''); } catch (e) {}
    saveLocal();
    afterSync();
    setSyncStatus('idle');
  } catch (e) {
    console.error('Sync-Fehler', e);
    setSyncStatus('error', e.message);
  } finally {
    syncInFlight = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}
let syncTimer;
function scheduleSync() { if (!syncConfig) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2500); }
function afterSync() { if (!current() && pos >= history.length) open(); else render(); }

function openSettings() {
  $('cfg-owner').value = syncConfig?.owner || '';
  $('cfg-repo').value = syncConfig?.repo || '';
  $('cfg-path').value = syncConfig?.path || '';
  $('cfg-token').value = syncConfig?.token || '';
  $('importStatus').textContent = '';
  $('dlgSettings').showModal();
}
$('btnSaveSync').addEventListener('click', () => {
  const owner = $('cfg-owner').value.trim(), repo = $('cfg-repo').value.trim();
  const path = $('cfg-path').value.trim() || 'horizont-daten.json', token = $('cfg-token').value.trim();
  if (!owner || !repo || !token) { $('syncStatus').className = 'status err'; $('syncStatus').textContent = 'Benutzername, Repository und Token sind nötig.'; return; }
  syncConfig = { owner, repo, path, token }; remoteSha = null;
  saveSyncConfig(); syncNow();
});
$('btnSyncNow').addEventListener('click', syncNow);
$('btnDisconnect').addEventListener('click', () => {
  syncConfig = null; remoteSha = null; saveSyncConfig();
  try { localStorage.removeItem(SHA_KEY); } catch (e) {}
  setSyncStatus('off');
  $('syncStatus').textContent = 'Getrennt. Die Gedanken bleiben lokal erhalten.';
});

function downloadJSON(filename, obj) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$('btnExport').addEventListener('click', () => downloadJSON(`horizont-export-${todayISO()}.json`, currentPayload()));
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', () => {
  const file = $('importFile').files[0]; $('importFile').value = '';
  if (!file) return;
  const st = $('importStatus'), reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      if (!payload || typeof payload.gedanken !== 'object') throw new Error('Die Datei enthält keinen Schlüssel «gedanken».');
      const s = mergeIncoming(payload);
      saveLocal(); scheduleSync(); afterSync();
      st.className = 'status'; st.textContent = `Importiert: ${s.added} neu, ${s.updated} aktualisiert.`;
    } catch (e) { st.className = 'status err'; st.textContent = 'Import fehlgeschlagen: ' + e.message; }
  };
  reader.readAsText(file);
});

/* =========================================================================
   Start & Rückkehr
   ========================================================================= */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const busy = document.querySelector('dialog[open]') || editing;
  if (hiddenAt && Date.now() - hiddenAt > RETURN_AFTER && !busy) { closeMenu(); open(); }
  else render();
  if (syncConfig) syncNow();
});
setInterval(() => { if (!current() && !document.hidden) render(); }, MIN);

loadLocal();
setSyncStatus(syncConfig ? 'idle' : 'off');
open();
if (syncConfig) syncNow();
</script>
